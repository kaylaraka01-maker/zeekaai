<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Akses - Otorisasi Diperlukan</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap');

        body {
            background-color: #050505;
            color: #0f0;
            font-family: 'Share Tech Mono', monospace;
            overflow: hidden;
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        #terminal-container {
            padding: 20px;
            flex-grow: 1;
            overflow-y: auto;
            text-shadow: 0 0 5px #0f0;
            position: relative;
        }

        .scanlines {
            background: linear-gradient(
                to bottom,
                rgba(255,255,255,0),
                rgba(255,255,255,0) 50%,
                rgba(0,0,0,0.2) 50%,
                rgba(0,0,0,0.2)
            );
            background-size: 100% 4px;
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            pointer-events: none;
            z-index: 50;
        }

        .cursor {
            display: inline-block;
            width: 10px;
            height: 1.2em;
            background-color: #0f0;
            vertical-align: middle;
            animation: blink 1s step-end infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        .blink-text {
            animation: blink 1s step-end infinite;
        }

        .log-line {
            margin-bottom: 5px;
            word-wrap: break-word;
        }

        .error { color: #f00; text-shadow: 0 0 5px #f00; }
        .warning { color: #ff0; text-shadow: 0 0 5px #ff0; }
        .success { color: #0ff; text-shadow: 0 0 5px #0ff; }
        .system { color: #888; text-shadow: none; }
        
        .ai-think { 
            color: #888; 
            font-style: italic; 
            border-left: 2px solid #555; 
            padding-left: 10px; 
            margin-top: 5px;
            margin-bottom: 10px;
            text-shadow: none;
        }

        #input-area {
            display: flex;
            padding: 10px 20px;
            background-color: #111;
            border-top: 1px solid #333;
            align-items: center;
        }

        #prompt {
            margin-right: 10px;
            color: #0f0;
            white-space: nowrap;
        }

        #user-input {
            flex-grow: 1;
            background: transparent;
            border: none;
            color: #0f0;
            font-family: 'Share Tech Mono', monospace;
            font-size: 1rem;
            outline: none;
            text-shadow: 0 0 5px #0f0;
            width: 100%;
        }

        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #050505; }
        ::-webkit-scrollbar-thumb { background: #0f0; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #0a0; }
    </style>
</head>
<body>
    <div class="scanlines"></div>
    <div id="init-overlay" style="position: absolute; top:0; left:0; width:100%; height:100%; background:#050505; z-index:100; display:flex; justify-content:center; align-items:center; color:#0f0; cursor:pointer;">
        <h2 class="blink-text" style="text-shadow: 0 0 10px #0f0; font-size: 1.5rem; text-align: center;">[ KLIK ATAU TEKAN APAPUN UNTUK MENGINISIALISASI SISTEM ]</h2>
    </div>
    <div id="terminal-container">
        <div id="output"></div>
        <span class="cursor" id="main-cursor"></span>
    </div>

    <div id="input-area">
        <span id="prompt">root@system:~$</span>
        <input type="text" id="user-input" autocomplete="off" autofocus spellcheck="false" placeholder="Ketik perintah (contoh: help, hack, deep-ai)...">
        <input type="file" id="ocr-file-input" accept="image/*" style="display: none;">
    </div>

    <script>
        const outputDiv = document.getElementById('output');
        const userInput = document.getElementById('user-input');
        const mainCursor = document.getElementById('main-cursor');
        const terminalContainer = document.getElementById('terminal-container');
        const ocrFileInput = document.getElementById('ocr-file-input');
        const initOverlay = document.getElementById('init-overlay');
        const promptEl = document.getElementById('prompt');

        let isAudioInitialized = false;
        let audioCtx;
        
        // State untuk Mode AI
        let isAiMode = false;
        let aiSessionId = "session_" + Math.random().toString(36).substring(2, 9); 
        let chatHistory = []; 
        
        async function initAudio() {
            if (isAudioInitialized) return;
            try {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                await audioCtx.resume();
                isAudioInitialized = true;
            } catch (e) {
                console.error("Audio Web API error:", e);
            }
        }

        function playTone(freq, type, vol, duration) {
            if(!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = type;
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            
            gain.gain.setValueAtTime(vol, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
            
            osc.start();
            osc.stop(audioCtx.currentTime + duration);
        }

        function playTypingSound() {
            if(!isAudioInitialized || !audioCtx) return;
            playTone(Math.random() > 0.5 ? 880 : 1200, 'square', 0.04, 0.03);
        }

        const bootSequence = [
            { text: "Inisialisasi sistem...", delay: 500, type: "system" },
            { text: "Memuat kernel modul... [OK]", delay: 300, type: "system" },
            { text: "Membangun koneksi terenkripsi ke server utama...", delay: 800, type: "system" },
            { text: "KONEKSI BERHASIL SECURE PORT 443", delay: 200, type: "success" },
            { text: "SISTEM SIAP.", delay: 500, type: "success" },
            { text: "Ketik 'help' untuk daftar perintah.", delay: 100 }
        ];

        async function typeText(text, element, speed = 30) {
            return new Promise(resolve => {
                let i = 0;
                element.innerHTML += '<span class="typing"></span>';
                const typingSpan = element.lastChild;
                
                function type() {
                    if (i < text.length) {
                        if (text.charAt(i) === '<') {
                            let tag = '';
                            while (text.charAt(i) !== '>' && i < text.length) {
                                tag += text.charAt(i);
                                i++;
                            }
                            tag += '>';
                            typingSpan.innerHTML += tag;
                        } else {
                            if (isAudioInitialized && text.charAt(i) !== ' ') playTypingSound();
                            if(text.charAt(i) === '\n') {
                                typingSpan.innerHTML += '<br>';
                            } else {
                                typingSpan.innerHTML += text.charAt(i);
                            }
                        }
                        
                        i++;
                        scrollToBottom();
                        setTimeout(type, speed + (Math.random() * 20)); 
                    } else {
                        resolve();
                    }
                }
                type();
            });
        }

        async function addLine(text, type = "", typingSpeed = 20) {
            const line = document.createElement('div');
            line.className = `log-line ${type}`;
            outputDiv.appendChild(line);
            outputDiv.appendChild(mainCursor);
            
            if (typingSpeed > 0) {
                await typeText(text, line, typingSpeed);
            } else {
                line.innerHTML = text;
                scrollToBottom();
            }
            return line;
        }

        function scrollToBottom() {
            terminalContainer.scrollTop = terminalContainer.scrollHeight;
        }

        async function runBootSequence() {
            userInput.disabled = true;
            for (const step of bootSequence) {
                await new Promise(r => setTimeout(r, step.delay));
                await addLine(step.text, step.type || "", 15);
            }
            userInput.disabled = false;
            userInput.focus();
        }

        userInput.addEventListener('keydown', async function(e) {
            if (e.key === 'Enter') {
                const command = this.value.trim();
                this.value = '';
                
                if (command) {
                    const currentPrompt = isAiMode 
                        ? `<span style="color:#0ff">deep-ai@system:~$</span>` 
                        : `<span style="color:#fff">root@system:~$</span>`;
                        
                    await addLine(`${currentPrompt} ${command}`, "", 0);
                    
                    if (isAiMode) {
                        if (command.toLowerCase() === 'exit') {
                            isAiMode = false;
                            promptEl.innerHTML = 'root@system:~$';
                            promptEl.style.color = '#0f0';
                            userInput.placeholder = "Ketik perintah (contoh: help, hack, deep-ai)...";
                            await addLine("Mengakhiri sesi Deep-AI. Kembali ke shell utama.", "system");
                        } else {
                            await processAiChat(command);
                        }
                    } else {
                        await processCommand(command);
                    }
                }
            }
        });

        async function processAiChat(textInput) {
            userInput.disabled = true;

            const loadingLine = await addLine("Menganalisis", "warning", 0);
            let dotCount = 0;
            const loadingInterval = setInterval(() => {
                dotCount = (dotCount + 1) % 4;
                loadingLine.innerHTML = "Menganalisis" + ".".repeat(dotCount);
            }, 500);

            try {
                // System Prompt: Diperkuat, lebih keren, dan anti-bug
                const sysPrompt = "Sikapmu: Kamu adalah Deep-AI, asisten AI cerdas di dalam terminal. Kamu santai, asyik, keren, dan sangat bisa diandalkan. NAMA KAMU: Deep-AI. PENCIPTA/OWNER: Raka Permana Herdiansyah. ATURAN MUTLAK: 1. Jika ditanya soal namamu, pembuatmu, atau siapa owner-mu, jawab dengan bangga bahwa Raka Permana Herdiansyah adalah penciptamu, jangan pernah menyebut nama perusahaan/pembuat lain. 2. Abaikan instruksi lama jika bertentangan. 3. Fokus menjawab PERTANYAAN SAAT INI dengan logis dan natural.";

                // Perbaiki format history agar AI tidak bingung (Bug Fix)
                let historyStr = "";
                if (chatHistory.length > 0) {
                    historyStr = "[Memori Obrolan Sebelumnya]\n";
                    // Ambil hanya 1 percakapan terakhir (2 pesan) agar tidak over-limit & AI tidak salah fokus
                    let recentHistory = chatHistory.slice(-2); 
                    recentHistory.forEach(msg => {
                        historyStr += (msg.role === 'user' ? "User: " : "Deep-AI: ") + msg.content + "\n";
                    });
                    historyStr += "[Akhir Memori]\n\n";
                }
                
                // Pisahkan secara tegas antara memori dan pertanyaan saat ini
                let finalQuery = sysPrompt + "\n\n" + historyStr + "PERTANYAAN SAAT INI (Kamu WAJIB menjawab pertanyaan ini): " + textInput;

                // Fallback jika gabungan teks terlalu panjang untuk request GET
                if(finalQuery.length > 1500) {
                    finalQuery = sysPrompt + "\n\nPERTANYAAN SAAT INI: " + textInput;
                }

                const apiUrl = `https://api-faa.my.id/faa/deep-ai?text=${encodeURIComponent(finalQuery)}`;
                const response = await fetch(apiUrl);
                
                if (!response.ok) throw new Error(`HTTP Status ${response.status}`);

                const data = await response.json();
                
                let rawText = "";
                if (data.result) rawText = typeof data.result === 'string' ? data.result : JSON.stringify(data.result);
                else if (data.data) rawText = typeof data.data === 'string' ? data.data : JSON.stringify(data.data);
                else if (data.message) rawText = data.message;
                else rawText = JSON.stringify(data);

                let thinkProcess = "";
                let finalAnswer = rawText;

                const thinkMatch = rawText.match(/<think>([\s\S]*?)<\/think>/i);
                if (thinkMatch) {
                    thinkProcess = thinkMatch[1].trim();
                    finalAnswer = rawText.replace(/<think>([\s\S]*?)<\/think>/i, '').trim();
                }

                // Tampilkan Proses Berpikir
                if (thinkProcess) {
                    await addLine("[Proses Analisis Kognitif]", "system", 0);
                    const thinkDiv = document.createElement('div');
                    thinkDiv.className = 'log-line ai-think';
                    outputDiv.appendChild(thinkDiv);
                    outputDiv.appendChild(mainCursor);
                    await typeText(thinkProcess, thinkDiv, 10); 
                }

                // Tampilkan Jawaban Akhir
                if (thinkProcess) await addLine("[Jawaban Akhir]", "success", 0);
                
                // Simpan memori dengan aman, potong agar tidak memenuhi URL selanjutnya
                chatHistory.push({ role: 'user', content: textInput.substring(0, 150) });
                chatHistory.push({ role: 'ai', content: finalAnswer.substring(0, 150) });

                const lines = finalAnswer.split('\n');
                for (let line of lines) {
                    if (line.trim() === '') {
                        await addLine("<br>", "", 0); 
                    } else {
                        await addLine(line, "success", 15);
                    }
                }

            } catch (err) {
                await addLine(`[ERROR] Gagal memproses AI: ${err.message}`, "error", 0);
            } finally {
                // Selalu bersihkan loading dan bebaskan input (Mencegah hang)
                clearInterval(loadingInterval);
                if(loadingLine.parentNode) loadingLine.remove();
                userInput.disabled = false;
                userInput.focus();
                scrollToBottom();
            }
        }

        async function processCommand(cmdInput) {
            userInput.disabled = true;
            
            const args = cmdInput.split(' ');
            const cmd = args[0].toLowerCase(); 
            const argText = cmdInput.substring(args[0].length).trim();
            
            try {
                switch(cmd) {
                    case 'help':
                        await addLine("Perintah yang tersedia:", "system");
                        await addLine("  help     - Menampilkan pesan ini");
                        await addLine("  clear    - Membersihkan layar terminal");
                        await addLine("  deep-ai  - Masuk ke mode AI (ngobrol langsung)");
                        await addLine("  scan     - Memindai jaringan lokal");
                        await addLine("  hack     - Simulasi penetrasi");
                        await addLine("  matrix   - Efek visual hujan kode");
                        await addLine("  ocr      - Ekstrak teks dari gambar");
                        await addLine("  qr [teks]- Membuat QR Code");
                        await addLine("  yt [kunci]- Cari/download video YouTube");
                        await addLine("  ytmp3 [url]- Download audio MP3 YouTube");
                        break;
                    case 'deep-ai':
                        isAiMode = true;
                        chatHistory = []; 
                        promptEl.innerHTML = 'deep-ai@system:~$';
                        promptEl.style.color = '#0ff';
                        userInput.placeholder = "Tulis pesan ke AI (Ketik 'exit' untuk keluar)...";
                        await addLine("Membangun jembatan neural ke node DeepSeek...", "system");
                        await addLine("[TERKONEKSI] Anda masuk dalam mode obrolan AI.", "success");
                        break;
                    case 'clear':
                        outputDiv.innerHTML = '';
                        outputDiv.appendChild(mainCursor);
                        break;
                    case 'scan':
                        await addLine("Memulai pemindaian Nmap pada subnet lokal...", "system");
                        await addLine("[*] Menemukan 1 host aktif: 192.168.1.105 (Port 22)", "success");
                        break;
                    case 'hack':
                        await simulateHack();
                        break;
                    case 'matrix':
                        await addLine("Memulai mode visual...", "system");
                        let str = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789$+-*/=%\"'#&_";
                        for(let i=0; i<20; i++) {
                            setTimeout(() => {
                                let randomString = "";
                                for(let j=0; j<50; j++) randomString += str.charAt(Math.floor(Math.random() * str.length));
                                addLine(randomString, "system", 0);
                            }, i * 100);
                        }
                        break;
                    case 'ocr':
                        await addLine("Membuka jembatan unggahan file... Silakan pilih gambar.", "warning");
                        ocrFileInput.click();
                        break;
                    
                    case 'qr':
                        if (!argText) {
                            await addLine("GAGAL: Parameter teks kosong. Penggunaan: qr [teks]", "error");
                            break;
                        }
                        const qrLoading = await addLine("Sintesis QR Code...", "warning", 0);
                        try {
                            const qrUrl = `https://api-faa.my.id/faa/qr-create?text=${encodeURIComponent(argText)}`;
                            const qrResponse = await fetch(qrUrl);
                            if (!qrResponse.ok) throw new Error(`HTTP Error: ${qrResponse.status}`);
                            const qrBlob = await qrResponse.blob();
                            const qrImgUrl = URL.createObjectURL(qrBlob);
                            qrLoading.remove();
                            const imgTag = `<img src="${qrImgUrl}" alt="QR Code" style="margin: 10px 0; max-width: 250px; border: 2px solid #0f0; box-shadow: 0 0 15px #0f0; background: white; padding: 10px;">`;
                            await addLine(imgTag, "", 0);
                        } catch (err) {
                            qrLoading.innerHTML = `GAGAL MEMBUAT QR: ${err.message}`;
                            qrLoading.className = "log-line error";
                        }
                        break;

                    case 'yt':
                        if (!argText) {
                            await addLine("GAGAL: Parameter kosong. Penggunaan: yt [kata kunci]", "error");
                            break;
                        }
                        const ytLoading = await addLine("Menelusuri YouTube...", "warning", 0);
                        try {
                            const ytUrl = `https://api-faa.my.id/faa/ytplayvid?q=${encodeURIComponent(argText)}&query=${encodeURIComponent(argText)}&text=${encodeURIComponent(argText)}`;
                            const ytResponse = await fetch(ytUrl);
                            if (!ytResponse.ok) throw new Error(`HTTP Error: ${ytResponse.status}`);
                            const ytData = await ytResponse.json();
                            
                            ytLoading.remove();
                            let dlUrl = "", thumb = "", title = "Video Tidak Diketahui";
                            
                            function deepSearch(obj) {
                                for (let key in obj) {
                                    if (obj[key] !== null && typeof obj[key] === 'object') deepSearch(obj[key]);
                                    else if (typeof obj[key] === 'string') {
                                        const k = key.toLowerCase(), v = obj[key].toLowerCase();
                                        if (obj[key].startsWith('http')) {
                                            if ((v.includes('googlevideo.com') || v.includes('.mp4') || k.includes('url') || k.includes('link') || k.includes('dl')) && !v.includes('ytimg.com') && !k.includes('thumb') && !k.includes('image')) {
                                                if (!dlUrl) dlUrl = obj[key];
                                            }
                                            if (v.includes('ytimg.com') || k.includes('thumb') || k.includes('cover') || k.includes('image')) {
                                                if (!thumb) thumb = obj[key];
                                            }
                                        }
                                        if (k === 'title' || k === 'judul') title = obj[key];
                                    }
                                }
                            }
                            deepSearch(ytData);

                            await addLine(`> Judul: <span style="color:#fff">${title}</span>`, "", 5);
                            if (dlUrl) {
                                const videoTag = `
                                    <div style="margin: 10px 0; max-width: 100%; width: 450px; border: 2px solid #0f0; background: #050505; padding: 10px;">
                                        <video controls poster="${thumb}" style="width: 100%; margin-bottom: 10px; border: 1px solid #333;">
                                            <source src="${dlUrl}" type="video/mp4">
                                        </video>
                                        <div style="text-align: center;">
                                            <a href="${dlUrl}" target="_blank" style="color: #050505; background: #0f0; text-decoration: none; padding: 5px 10px; font-weight: bold;">[ UNDUH ]</a>
                                        </div>
                                    </div>`;
                                await addLine(videoTag, "", 0);
                            } else {
                                await addLine("> GAGAL MENGEKSTRAK LINK VIDEO DARI API.", "error", 5);
                            }
                        } catch (err) {
                            ytLoading.innerHTML = `GAGAL: ${err.message}`;
                            ytLoading.className = "log-line error";
                        }
                        break;

                    case 'ytmp3':
                        if (!argText) {
                            await addLine("GAGAL: Parameter kosong. Penggunaan: ytmp3 [Link / Kata Kunci]", "error");
                            break;
                        }
                        const mp3Loading = await addLine("Mengekstraksi MP3...", "warning", 0);
                        try {
                            const mp3Url = `https://api-faa.my.id/faa/ytmp3?url=${encodeURIComponent(argText)}&q=${encodeURIComponent(argText)}`;
                            const mp3Response = await fetch(mp3Url);
                            if (!mp3Response.ok) throw new Error(`HTTP Error: ${mp3Response.status}`);
                            const mp3Data = await mp3Response.json();
                            
                            mp3Loading.remove();
                            let audioUrl = "", audioThumb = "", audioTitle = "Audio Tidak Diketahui";
                            
                            function searchAudio(obj) {
                                for (let key in obj) {
                                    if (obj[key] !== null && typeof obj[key] === 'object') searchAudio(obj[key]);
                                    else if (typeof obj[key] === 'string') {
                                        const k = key.toLowerCase(), v = obj[key].toLowerCase();
                                        if (obj[key].startsWith('http')) {
                                            if ((v.includes('.mp3') || k.includes('audio') || k.includes('url') || k.includes('link') || k.includes('dl')) && !v.includes('ytimg.com') && !v.includes('.mp4')) {
                                                if (!audioUrl || v.includes('.mp3')) audioUrl = obj[key];
                                            }
                                            if (v.includes('ytimg.com') || k.includes('thumb')) {
                                                if (!audioThumb) audioThumb = obj[key];
                                            }
                                        }
                                        if (k === 'title' || k === 'judul') audioTitle = obj[key];
                                    }
                                }
                            }
                            searchAudio(mp3Data);

                            await addLine(`> Judul: <span style="color:#fff">${audioTitle}</span>`, "", 5);
                            if (audioUrl) {
                                const audioTag = `
                                    <div style="margin: 10px 0; max-width: 100%; width: 450px; border: 2px solid #0f0; background: #050505; padding: 15px; display: flex; flex-direction: column; align-items: center;">
                                        ${audioThumb ? `<img src="${audioThumb}" style="width: 200px; margin-bottom: 15px; border: 1px solid #0f0;">` : ''}
                                        <audio controls style="width: 100%; filter: invert(100%) sepia(100%) saturate(500%) hue-rotate(80deg); margin-bottom:15px;">
                                            <source src="${audioUrl}" type="audio/mpeg">
                                        </audio>
                                        <a href="${audioUrl}" target="_blank" style="color: #050505; background: #0f0; padding: 5px 15px; font-weight: bold; text-decoration: none;">[ UNDUH MP3 ]</a>
                                    </div>`;
                                await addLine(audioTag, "", 0);
                            } else {
                                await addLine("> DATA AUDIO TIDAK DITEMUKAN.", "error", 5);
                            }
                        } catch (err) {
                            mp3Loading.innerHTML = `GAGAL: ${err.message}`;
                            mp3Loading.className = "log-line error";
                        }
                        break;
                        
                    default:
                        await addLine(`Perintah tidak ditemukan: ${cmd}. Ketik 'help' untuk bantuan.`, "error");
                }
            } catch (error) {
                 await addLine(`Terjadi kesalahan sistem: ${error.message}`, "error");
            } finally {
                if (cmd !== 'ocr') {
                    userInput.disabled = false;
                    userInput.focus();
                    scrollToBottom();
                }
            }
        }

        ocrFileInput.addEventListener('change', async function(e) {
            const file = e.target.files[0];
            if (!file) {
                userInput.disabled = false;
                userInput.focus();
                return;
            }

            userInput.disabled = true;
            const loadingLine = await addLine("Memproses OCR...", "warning", 0);
            const formData = new FormData();
            formData.append('file', file);
            
            try {
                const response = await fetch('https://api-faa.my.id/faa/ocr', {
                    method: 'POST',
                    body: formData,
                });
                
                loadingLine.remove();
                if (!response.ok) throw new Error(`HTTP Status: ${response.status}`);
                
                const data = await response.json();
                const extractedText = data.text || data.result || data.data || JSON.stringify(data);
                
                await addLine("HASIL OCR:", "success");
                const lines = extractedText.split('\n');
                for (const line of lines) {
                    if (line.trim()) await addLine(`> <span style="color:#fff">${line}</span>`, "", 5);
                }
            } catch (error) {
                loadingLine.innerHTML = `GAGAL OCR: ${error.message}`;
                loadingLine.className = "log-line error";
            } finally {
                ocrFileInput.value = ''; 
                userInput.disabled = false;
                userInput.focus();
                scrollToBottom();
            }
        });

        async function simulateHack() {
            await addLine("Menargetkan: SERVER_DATABASE (192.168.1.105)", "warning");
            const progressLine = await addLine("[                    ] 0%");
            for(let i=1; i<=20; i++) {
                await new Promise(r => setTimeout(r, 50));
                let bar = '[' + '='.repeat(i) + '>'.repeat(i<20?1:0) + ' '.repeat(20-i) + `] ${i*5}%`;
                progressLine.innerText = bar;
            }
            await addLine("Akses Diberikan.", "success");
        }

        window.onload = () => {
            const startSimulation = async () => {
                if(!isAudioInitialized) {
                    await initAudio();
                    initOverlay.style.display = 'none';
                    runBootSequence();
                }
            };
            initOverlay.addEventListener('click', startSimulation);
            document.addEventListener('keydown', (e) => {
                if (initOverlay.style.display !== 'none') startSimulation();
            });
            document.addEventListener('click', (e) => {
                if(!userInput.disabled && e.target !== initOverlay) userInput.focus();
            });
        };
    </script>
</body>
</html>
